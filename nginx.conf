server {
    listen 80;
    server_name localhost;

    # Zombie SW Mitigation: Never cache the Service Worker or Web Manifest
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Content Security Policy & HTTP Security Headers
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co /api/v1/telemetry; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; frame-ancestors 'none';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
}
